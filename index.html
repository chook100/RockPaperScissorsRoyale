<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=volume_up,volume_off"/>

    <title>Rock, Paper, Scissors Royale</title>
    <link rel="icon", type="image/x-icon", href="icon.png">
</head>
<body>
     <canvas id="canvas"></canvas>

     <label id="timer">Loading...</label>

     <span class="material-symbols-outlined" id="toggle_sound">volume_up</span>

     <input type="range" min="0.5" max="25" value="0.5" step="0.5" class="slider", id="speed_slider">
     <input type="range" min="1" max="100" value="100" class="slider", id="count_slider">

     <script src="main.js"></script>
</body>
</html>
